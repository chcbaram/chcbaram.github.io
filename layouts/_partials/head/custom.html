{{- /* canonical 은 테마가 이미 내보낸다. 여기에 또 넣으면 중복된다. */ -}}
{{- with site.Params.googleSiteVerification -}}
    <meta name="google-site-verification" content="{{ . }}">
{{- end -}}
{{- with site.Params.naverSiteVerification -}}
    <meta name="naver-site-verification" content="{{ . }}">
{{- end -}}
{{- /* D2Coding (SIL OFL 1.1). 한글 포함 subset 판을 쓴다. */ -}}
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/d2coding@1.3.2/d2coding-subset.css">
<meta name="theme-color" content="#0b0b0b">
