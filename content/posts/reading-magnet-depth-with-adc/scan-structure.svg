  <rect x="162" y="154" width="9" height="9" rx="1.5" fill="#1d4ed8"/>
  <rect x="36" y="165" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="54" y="165" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="72" y="165" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="90" y="165" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="108" y="165" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="126" y="165" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="144" y="165" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="162" y="165" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="36" y="176" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="54" y="176" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="72" y="176" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="90" y="176" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="108" y="176" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="126" y="176" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="144" y="176" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="162" y="176" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="36" y="187" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="54" y="187" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="72" y="187" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
