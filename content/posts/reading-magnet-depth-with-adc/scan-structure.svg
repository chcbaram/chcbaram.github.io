<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <style>
    .m   { font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #6b7280; }
    .b   { font-size: 14px; font-weight: 600; }
    .s   { font-size: 11.5px; fill: #6b7280; }
    .ttl { font-size: 15px; font-weight: 700; fill: #374151; }
    .lbl { font-size: 12px; font-weight: 600; fill: #4b5563; }
  </style>
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
    </marker>
  </defs>
  <rect width="880" height="470" fill="#ffffff"/>
  <text x="20" y="26" class="ttl">One scan: 64 sensors through 8 ADC channels</text>
  <text x="20" y="46" class="s">Eight multiplexer steps, eight channels each. The ADC never sees more than eight sensors at a time.</text>
  <rect x="20" y="78" width="176" height="150" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="34" y="100" class="b" fill="#1d4ed8">Hall sensors</text>
  <text x="34" y="118" class="s">one per key, always powered</text>
  <rect x="36" y="132" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="54" y="132" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
