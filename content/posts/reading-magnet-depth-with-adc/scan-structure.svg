  <rect x="54" y="143" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="72" y="143" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="90" y="143" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="108" y="143" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="126" y="143" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="144" y="143" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="162" y="143" width="9" height="9" rx="1.5" fill="#bfdbfe"/>
  <rect x="36" y="154" width="9" height="9" rx="1.5" fill="#1d4ed8"/>
  <rect x="54" y="154" width="9" height="9" rx="1.5" fill="#1d4ed8"/>
  <rect x="72" y="154" width="9" height="9" rx="1.5" fill="#1d4ed8"/>
  <rect x="90" y="154" width="9" height="9" rx="1.5" fill="#1d4ed8"/>
