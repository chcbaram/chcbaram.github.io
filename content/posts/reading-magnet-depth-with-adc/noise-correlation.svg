  <text x="357.1" y="112" class="lbl" fill="#1d4ed8">Three points on the model</text>
  <text x="357.1" y="130" class="s">0.32 us apart &#8594; 0.97   a burst oversample: nothing to average</text>
  <text x="357.1" y="146" class="s">25 us apart &#8594; 0.09   three accumulated samples, independent</text>
  <text x="357.1" y="162" class="s">28 us apart &#8594; 0.07   what one scan period should give</text>
  <path d="M572.6,222.0 L572.6,312.9" stroke="#db2777" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="572.6" cy="222.0" r="6" fill="#db2777"/>
  <text x="560.6" y="227.0" class="b" fill="#be185d" text-anchor="end">measured 0.45</text>
  <text x="586.6" y="265.4" class="b" fill="#be185d">the gap</text>
  <text x="586.6" y="281.4" class="s" fill="#be185d">is 1/f flicker</text>
  <rect x="700" y="90" width="160" height="240" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="714" y="112" class="b" fill="#1d4ed8">Why it matters</text>
  <text x="714" y="134" class="s">Adding N samples only buys</text>
  <text x="714" y="147" class="s">sqrt(N) if they really are</text>
  <text x="714" y="160" class="s">independent.</text>
  <text x="714" y="186" class="s">Three samples 25 us apart</text>
  <text x="714" y="199" class="s">should have given 1.73x.</text>
  <text x="714" y="212" class="s">Measured: 1.31x.</text>
  <text x="714" y="238" class="s">White noise averages away.</text>
  <text x="714" y="251" class="s">1/f does not &#8212; an 84 us</text>
  <text x="714" y="264" class="s">window is far too short</text>
  <text x="714" y="277" class="s">to touch it.</text>
  <text x="714" y="303" class="s">Peak-to-peak 39 counts is</text>
  <text x="714" y="316" class="s">this hardware's floor.</text>
  <rect x="20" y="362" width="840" height="58" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="36" y="384" class="b" fill="#b45309">The LED test ruled out the other suspect</text>
  <text x="36" y="403" class="s">Peak-to-peak stayed at 39 counts with the LEDs off, at 3 % white and at 6 % white. So it is not power coupling.</text>
</svg>
