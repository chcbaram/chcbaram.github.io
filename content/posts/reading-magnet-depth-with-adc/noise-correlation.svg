  <path d="M607.1,90 L607.1,330" stroke="#e5e7eb"/>
  <text x="607.1" y="348" class="s" text-anchor="middle">30 us</text>
  <text x="383" y="370" class="lbl" text-anchor="middle">gap between samples</text>
  <text x="26" y="210" class="lbl" transform="rotate(-90 26 210)" text-anchor="middle">correlation</text>
