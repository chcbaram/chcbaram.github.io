<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <style>
    .m   { font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; fill: #6b7280; }
    .b   { font-size: 14px; font-weight: 600; }
    .s   { font-size: 11.5px; fill: #6b7280; }
    .ttl { font-size: 15px; font-weight: 700; fill: #374151; }
    .lbl { font-size: 12px; font-weight: 600; fill: #4b5563; }
  </style>
  <defs>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
    </marker>
  </defs>
  <rect width="880" height="330" fill="#ffffff"/>
  <text x="20" y="26" class="ttl">Hiding the work inside the conversion wait</text>
  <text x="20" y="46" class="s">One step. The ADC takes the same 2.96 us either way &#8212; only the order of the code changed.</text>
  <text x="20" y="100" class="lbl">Before</text>
  <text x="20" y="118" class="s">3.89 us</text>
  <rect x="120.0" y="80" width="532.8" height="46" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="386.4" y="102" class="b" text-anchor="middle" fill="#9ca3af">conversion wait &#8212; CPU spinning</text>
  <text x="386.4" y="118" class="s" text-anchor="middle">2.96 us</text>
  <rect x="652.8" y="80" width="167.4" height="46" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="736.5" y="102" class="b" text-anchor="middle" fill="#be185d">process</text>
  <text x="736.5" y="118" class="s" text-anchor="middle">0.93 us</text>
  <text x="20" y="196" class="lbl">After</text>
  <text x="20" y="214" class="s">2.96 us</text>
  <rect x="120.0" y="176" width="532.8" height="52" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="386.4" y="196" class="b" text-anchor="middle" fill="#15803d">conversion wait &#8212; 2.96 us</text>
  <rect x="132.0" y="202" width="167.4" height="20" rx="3" fill="#ffffff" stroke="#86efac"/>
  <text x="215.7" y="216" class="m" text-anchor="middle" fill="#15803d">process step N-1</text>
  <path d="M720.6,150 L216.6,174" stroke="#db2777" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ap)" fill="none"/>
  <text x="470" y="140" class="s" fill="#be185d" text-anchor="middle">the same work, moved inside the wait</text>
  <path d="M120.0,252 L652.8,252" stroke="#9ca3af" stroke-width="1"/>
  <path d="M120.0,248 L120.0,256" stroke="#9ca3af" stroke-width="1"/>
  <path d="M652.8,248 L652.8,256" stroke="#9ca3af" stroke-width="1"/>
  <text x="386.4" y="270" class="s" text-anchor="middle">0.93 us saved on every one of the eight steps</text>
  <rect x="20" y="286" width="840" height="34" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="36" y="308" class="s">The next trigger overwrites the DMA buffer, so the eight words are copied out first &#8212; far cheaper than what they hide.</text>
</svg>
