  <text x="602" y="114" class="b" fill="#1d4ed8">The magnet size falls out too</text>
  <text x="602" y="134" class="s">Scan radius and length, keep only the</text>
  <text x="602" y="149" class="s">candidates whose back-solved remanence</text>
  <text x="602" y="164" class="s">stays under 1.45 T, the NdFeB ceiling.</text>
