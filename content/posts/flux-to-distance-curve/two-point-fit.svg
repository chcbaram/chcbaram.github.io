  <rect x="20" y="390" width="840" height="56" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="36" y="412" class="b" fill="#15803d">And the shape of the curve barely cares which magnet it was</text>
  <text x="36" y="431" class="s">With both ends pinned, 4.0 x 2.0 mm and 4.0 x 2.5 mm differ by 0.1 % in the middle of the stroke. In distance, about 2 um.</text>
