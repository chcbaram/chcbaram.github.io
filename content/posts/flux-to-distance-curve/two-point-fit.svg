  <text x="20" y="26" class="ttl">Two points the manufacturer publishes, and the whole curve follows</text>
  <text x="20" y="46" class="s">Axial field of a cylinder magnet. Taking the ratio of the two points cancels the remanence, so only the effective gap is left to solve for.</text>
