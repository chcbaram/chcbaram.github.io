<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="636" viewBox="0 0 1180 636" role="img" aria-label="How a key press is decided">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect width="1180" height="636" fill="#ffffff"/>
<text xml:space="preserve" x="40" y="38" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="17" fill="#1f2328" text-anchor="start" font-weight="700">Getting to a key press — the stages the signal goes through</text>
<text xml:space="preserve" x="40" y="60" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" fill="#6a737d" text-anchor="start" font-weight="400">All numbers measured. The two thresholds are per key, solved from the user's millimetre settings.</text>
<rect x="40" y="88" width="200" height="132" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.6"/>
<text xml:space="preserve" x="140.0" y="112" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.5" fill="#1f2328" text-anchor="middle" font-weight="700">① ADC sequence</text>
<line x1="52" y1="122" x2="228" y2="122" stroke="#9ca3af" stroke-width="1"/>
<text xml:space="preserve" x="54" y="142" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">ADC0, 4 ch</text>
<text xml:space="preserve" x="54" y="159" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">ADC1, 4 ch</text>
<text xml:space="preserve" x="54" y="176" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">converted together</text>
<text xml:space="preserve" x="54" y="210" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">16-bit raw</text>
<line x1="245" y1="154.0" x2="267" y2="154.0" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="272" y="88" width="200" height="132" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
<text xml:space="preserve" x="372.0" y="112" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.5" fill="#1f2328" text-anchor="middle" font-weight="700">② Down to 12 bits</text>
<line x1="284" y1="122" x2="460" y2="122" stroke="#3b82f6" stroke-width="1"/>
<text xml:space="preserve" x="286" y="142" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">raw &gt;&gt; 4</text>
<text xml:space="preserve" x="286" y="176" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">bottom 4 bits:</text>
<text xml:space="preserve" x="286" y="193" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">noise only</text>
<text xml:space="preserve" x="286" y="210" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">then a sum of the last 3</text>
<line x1="477" y1="154.0" x2="499" y2="154.0" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="504" y="88" width="200" height="132" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
<text xml:space="preserve" x="604.0" y="112" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.5" fill="#1f2328" text-anchor="middle" font-weight="700">③ Deadband ±12</text>
<line x1="516" y1="122" x2="692" y2="122" stroke="#16a34a" stroke-width="1"/>
<text xml:space="preserve" x="518" y="142" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">outside the band → now</text>
<text xml:space="preserve" x="518" y="159" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">inside → not passed on</text>
<text xml:space="preserve" x="518" y="193" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">zero lag</text>
<text xml:space="preserve" x="518" y="210" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">band is on the sum scale</text>
<line x1="709" y1="154.0" x2="731" y2="154.0" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="736" y="88" width="200" height="132" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
<text xml:space="preserve" x="836.0" y="112" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.5" fill="#1f2328" text-anchor="middle" font-weight="700">④ Baseline tracking</text>
<line x1="748" y1="122" x2="924" y2="122" stroke="#d97706" stroke-width="1"/>
<text xml:space="preserve" x="750" y="142" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">at rest = the extreme</text>
<text xml:space="preserve" x="750" y="176" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">big jump → now</text>
<text xml:space="preserve" x="750" y="193" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">ripple → 3 cnt / 512 ms</text>
<text xml:space="preserve" x="750" y="210" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">frozen while pressed</text>
<line x1="941" y1="154.0" x2="963" y2="154.0" stroke="#8c959f" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="968" y="88" width="200" height="132" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
<text xml:space="preserve" x="1068.0" y="112" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.5" fill="#1f2328" text-anchor="middle" font-weight="700">⑤ Decision</text>
<line x1="980" y1="122" x2="1156" y2="122" stroke="#7c3aed" stroke-width="1"/>
<text xml:space="preserve" x="982" y="142" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">d = base - raw</text>
<text xml:space="preserve" x="982" y="176" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">d &gt; press   → down</text>
<text xml:space="preserve" x="982" y="193" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">d &lt; release → up</text>
<text xml:space="preserve" x="982" y="210" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">both are set in mm</text>
<text xml:space="preserve" x="40" y="254" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#1f2328" text-anchor="start" font-weight="700">What the numbers look like</text>
<text xml:space="preserve" x="48" y="284" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#6a737d" text-anchor="start" font-weight="700"></text>
<text xml:space="preserve" x="178" y="284" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#6a737d" text-anchor="start" font-weight="700">baseline at rest</text>
<text xml:space="preserve" x="378" y="284" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#6a737d" text-anchor="start" font-weight="700">full stroke</text>
<text xml:space="preserve" x="528" y="284" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#6a737d" text-anchor="start" font-weight="700">noise p-p</text>
<text xml:space="preserve" x="658" y="284" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#6a737d" text-anchor="start" font-weight="700">press threshold</text>
<rect x="40" y="292" width="740" height="24" rx="3" fill="#fafbfc" stroke="#e5e7eb" stroke-width="0.8"/>
<text xml:space="preserve" x="48" y="309" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="700">16-bit (①)</text>
<text xml:space="preserve" x="178" y="309" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">40,000 ~ 46,000</text>
<text xml:space="preserve" x="378" y="309" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">13,400</text>
<text xml:space="preserve" x="528" y="309" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">200</text>
<text xml:space="preserve" x="658" y="309" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">—</text>
<rect x="40" y="318" width="740" height="24" rx="3" fill="#ffffff" stroke="#e5e7eb" stroke-width="0.8"/>
<text xml:space="preserve" x="48" y="335" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="700">summed x3 (③ on)</text>
<text xml:space="preserve" x="178" y="335" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">7,474 ~ 8,383</text>
<text xml:space="preserve" x="378" y="335" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">2,514</text>
<text xml:space="preserve" x="528" y="335" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">39</text>
<text xml:space="preserve" x="658" y="335" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">144 @ 0.50 mm</text>
<text xml:space="preserve" x="40" y="388" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#1f2328" text-anchor="start" font-weight="700">One key pressed and released (measured, 12-bit scale)</text>
<rect x="40" y="402" width="700" height="196" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
<line x1="40" y1="424" x2="740" y2="424" stroke="#d97706" stroke-width="1.6"/>
<text xml:space="preserve" x="734" y="417" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#d97706" text-anchor="end" font-weight="700">baseline 2524  (at rest)</text>
<text xml:space="preserve" x="50" y="417" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#d97706" text-anchor="start" font-weight="400">hand off</text>
<line x1="40" y1="469.34606205250594" x2="740" y2="469.34606205250594" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="5 4"/>
<text xml:space="preserve" x="50" y="463.34606205250594" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#7c3aed" text-anchor="start" font-weight="700">press threshold 250</text>
<line x1="40" y1="452.2959427207637" x2="740" y2="452.2959427207637" stroke="#0ea5e9" stroke-width="1.3" stroke-dasharray="5 4"/>
<text xml:space="preserve" x="734" y="467.2959427207637" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#0ea5e9" text-anchor="end" font-weight="700">release threshold 156</text>
<path d="M 80.0,424.0 L 196.0,439.6 L 312.0,501.8 L 428.0,574.9 L 544.0,468.8 L 660.0,424.0" fill="none" stroke="#16a34a" stroke-width="2.4"/>
<circle cx="80.0" cy="424.0" r="3.2" fill="#16a34a"/>
<circle cx="196.0" cy="439.6" r="3.2" fill="#16a34a"/>
<text xml:space="preserve" x="196.0" y="456.59904534606204" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">-86</text>
<circle cx="312.0" cy="501.8" r="3.2" fill="#16a34a"/>
<text xml:space="preserve" x="312.0" y="518.8138424821002" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">-429</text>
<circle cx="428.0" cy="574.9" r="3.2" fill="#16a34a"/>
<text xml:space="preserve" x="428.0" y="591.9116945107398" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">-832</text>
<circle cx="544.0" cy="468.8" r="3.2" fill="#16a34a"/>
<text xml:space="preserve" x="544.0" y="485.8019093078759" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">-247</text>
<circle cx="660.0" cy="424.0" r="3.2" fill="#16a34a"/>
<text xml:space="preserve" x="50" y="590" font-family="ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" fill="#6a737d" text-anchor="start" font-weight="400">bottom = full stroke 838</text>
<rect x="766" y="402" width="374" height="196" rx="5" fill="#fafbfc" stroke="#e5e7eb" stroke-width="1"/>
<text xml:space="preserve" x="780" y="428" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">No filter lag: a change bigger than</text>
<text xml:space="preserve" x="780" y="444" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">the band shows up in the same sample.</text>
<text xml:space="preserve" x="780" y="460" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400"></text>
<text xml:space="preserve" x="780" y="476" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">Under the old IIR filter the same</text>
<text xml:space="preserve" x="780" y="492" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">press only reached -652. The filter,</text>
<text xml:space="preserve" x="780" y="508" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">not the finger, drew that curve.</text>
<text xml:space="preserve" x="780" y="524" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400"></text>
<text xml:space="preserve" x="780" y="540" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">250 / 156 (1.20 / 0.75 mm) were the</text>
<text xml:space="preserve" x="780" y="556" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11.5" fill="#1f2328" text-anchor="start" font-weight="400">fixed levels then; today both come from mm.</text>
</svg>
