baseURL                = "https://chcbaram.github.io/"
title                  = "Baram"
defaultContentLanguage       = "en"
defaultContentLanguageInSubdir = false   # 영어는 /, 한국어는 /ko/
hasCJKLanguage               = true      # 한국어 글의 요약·글자수 계산용

[languages]
    [languages.en]
        label        = "English"
        locale       = "en"
        weight       = 1
        title        = "Baram"
    [languages.ko]
        label        = "한국어"
        locale       = "ko"
        weight       = 2
        title        = "Baram"
        [languages.ko.params.sidebar]
            subtitle = "펌웨어와 하드웨어, 그리고 그 주변 도구들."
        [languages.ko.params.comments.giscus]
            lang = "ko"

# robots.txt 는 static/robots.txt 를 쓴다. 둘 다 켜면 충돌한다.
enableRobotsTXT = false

# 글 URL 은 Hugo 기본값 그대로 /posts/<slug>/ 다.
# Stack starter 의 permalinks.toml(post = "/p/:slug/")은 복사하지 않는다.
[permalinks]
    # 고정 페이지만 루트로 올린다: /about/, /search/, /archives/
    # 루트 slug 는 chcbaram 저장소 이름과 겹치면 안 된다 (프로젝트 Pages 와 충돌)
    page = "/:slug/"

[pagination]
    pagerSize = 10

[taxonomies]
    tag = "tags"
    project = "projects"
    series = "series"
    # 안 쓰더라도 정의는 남긴다. 지우면 테마의 categories 위젯이 깨진다.
    category = "categories"

[module]
    [[module.imports]]
        path = "github.com/CaiJimmy/hugo-theme-stack/v4"

[markup]
    [markup.goldmark.renderer]
        unsafe = true
    [markup.highlight]
        noClasses         = false
        codeFences        = true
        guessSyntax       = true
        lineNoStart       = 1
        lineNos           = true
        lineNumbersInTable = true
        tabWidth          = 4
    [markup.tableOfContents]
        endLevel   = 3
        ordered    = false
        startLevel = 2

# /llms.txt 를 빌드 때 자동 생성한다. 템플릿은 layouts/home.llms.txt
[outputFormats]
    [outputFormats.llms]
        mediaType      = "text/plain"
        baseName       = "llms"
        isPlainText    = true
        notAlternative = true

[outputs]
    home = ["HTML", "RSS", "llms"]

[params]
    # Stack 기본값은 ["post"](단수). 빠뜨리면 홈에 글이 안 뜬다.
    mainSections   = ["posts"]
    # 프로젝트 목록에서 NEW 배지를 붙일 기준 일수
    recentDays     = 14
    # 댓글 수를 브라우저에 캐시할 시간(초). GitHub 비로그인 API 는 IP당 시간당 60회다
    commentsCacheSeconds = 300
    rssFullContent = true
    SortBy         = "date"

    # 단계 5: 값 받으면 채운다
    googleSiteVerification = ""
    naverSiteVerification  = ""

    [params.footer]
        since      = 2026
        customText = ""

    [params.dateFormat]
        published   = "2006-01-02"
        lastUpdated = "2006-01-02"

    [params.sidebar]
        compact  = false
        avatar   = "img/avatar.jpg"
        subtitle = "Firmware, hardware, and the tools around them."

    [params.article]
        headingAnchor = true
        math          = false
        toc           = true
        readingTime   = true
        [params.article.list]
            # 홈 카드에서는 태그를 안 보여준다. 사이드바 태그 클라우드와 글 화면에는 그대로 있다
            showTags = false
        [params.article.license]
            # TODO(author): 글 라이선스 표시 여부를 정한다
            enabled = false
            default = "Licensed under CC BY-NC-SA 4.0"

    [params.colorScheme]
        toggle  = true
        default = "auto"

    [params.comments]
        # Discussions 활성화와 giscus 앱 설치는 2026-09-27 에 완료됐다.
        # repoID / categoryID 는 GitHub GraphQL 에서 조회한 실제 값이다.
        enabled  = true
        provider = "giscus"
        [params.comments.giscus]
            repo             = "chcbaram/chcbaram.github.io"
            repoID           = "R_kgDOUtNr7Q"
            category         = "Announcements"
            categoryID       = "DIC_kwDOUtNr7c4DGdQa"
            mapping          = "pathname"
            strict           = "1"
            reactionsEnabled = "1"
            emitMetadata     = "0"
            inputPosition    = "bottom"
            lightTheme       = "light"
            darkTheme        = "dark"
            lang             = "en"
            loading          = "lazy"

    [params.opengraph]
        [params.opengraph.twitter]
            site = ""
            card = "summary_large_image"

    [[params.widgets.homepage]]
        type = "search"

    [[params.widgets.homepage]]
        type = "taxonomy"
        [params.widgets.homepage.params]
            taxonomy = "projects"
            title    = "Projects"
            icon     = "categories"
            limit    = 10

    [[params.widgets.homepage]]
        type = "tag-cloud"
        [params.widgets.homepage.params]
            limit = 10

    [[params.widgets.homepage]]
        type = "comments"

    [[params.widgets.homepage]]
        type = "archives"
        [params.widgets.homepage.params]
            limit = 5

    [[params.widgets.page]]
        type = "toc"

# ── 메뉴 ──────────────────────────────────────────────
# 언어별로 나눠 둔다. 루트에 [[menu.*]] 로 두면 한국어 쪽도 영어 라벨이 나온다.
# URL 대신 pageRef 를 쓰면 언어 접두사(/ko/)가 자동으로 붙는다.

[[languages.en.menus.social]]
    identifier = "github"
    name       = "GitHub"
    url        = "https://github.com/chcbaram"
    [languages.en.menus.social.params]
        icon = "brand-github"

[[languages.en.menus.social]]
    identifier = "naver"
    name       = "Naver Blog"
    url        = "https://blog.naver.com/chcbaram"
    [languages.en.menus.social.params]
        icon = "link"

[[languages.en.menus.main]]
    identifier = "projects"
    name       = "Projects"
    pageRef    = "/projects"
    weight     = -80
    [languages.en.menus.main.params]
        icon = "categories"

[[languages.en.menus.main]]
    identifier = "tags"
    name       = "Tags"
    pageRef    = "/tags"
    weight     = -75
    [languages.en.menus.main.params]
        icon = "tag"

[[languages.ko.menus.social]]
    identifier = "github"
    name       = "GitHub"
    url        = "https://github.com/chcbaram"
    [languages.ko.menus.social.params]
        icon = "brand-github"

[[languages.ko.menus.social]]
    identifier = "naver"
    name       = "네이버 블로그"
    url        = "https://blog.naver.com/chcbaram"
    [languages.ko.menus.social.params]
        icon = "link"

[[languages.ko.menus.main]]
    identifier = "projects"
    name       = "프로젝트"
    pageRef    = "/projects"
    weight     = -80
    [languages.ko.menus.main.params]
        icon = "categories"

[[languages.ko.menus.main]]
    identifier = "tags"
    name       = "태그"
    pageRef    = "/tags"
    weight     = -75
    [languages.ko.menus.main.params]
        icon = "tag"
